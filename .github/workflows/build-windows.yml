name: Windows desktop build
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install using the first-time setup batch file
        shell: cmd
        run: |
          chcp 65001 >nul
          call "首次安裝.bat" --no-pause
      - run: .\.venv\Scripts\python.exe -m pip install -r requirements-dev.txt
      - run: .\.venv\Scripts\python.exe -m pytest -q
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Check the launch batch file using synthetic data
        shell: cmd
        env:
          FOF_NO_PAUSE: '1'
          QT_QPA_PLATFORM: offscreen
        run: |
          chcp 65001 >nul
          call "啟動程式.bat" --self-test "%RUNNER_TEMP%\FOF launch check"
      - run: .\.venv\Scripts\python.exe -m PyInstaller --noconfirm --clean FOFExamManager.spec
      - uses: actions/upload-artifact@v4
        with:
          name: FOFExamManager-Windows
          path: dist/FOFExamManager/
